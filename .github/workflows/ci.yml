name: LifeOS CI
on:
  push:
    branches: ["main", "lifeos-v2-foundation"]
  pull_request:
    # Validate PRs regardless of target branch, including stacked feature branches.
    branches: ["**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
